# PROFILE_MARKER: qwen3_omni_realtime_smoke_2026_05_30_v3
# Qwen3-Omni-MoE realtime smoke overlay — derived from the bundled
# `vllm_omni/deploy/qwen3_omni_moe.yaml` (2x H100, stage 0 on cuda:0,
# stages 1+2 on cuda:1), then adjusted for realtime smoke testing.
#
# Changes from upstream:
# - `async_chunk: false` for `/v1/realtime`.
# - lower stage budgets so the thinker does not OOM on 80GB GPUs during KV
#   cache allocation / compile profiling. This is a smoke profile, not a
#   throughput-tuned production profile.
#
# Target: 2× H100/H200-class GPUs for best odds. A100-80GB may work with this
# reduced profile but remains unverified.

# CHANGED FROM UPSTREAM: was `true`. /v1/realtime is unsupported when
# async_chunk is enabled (per vLLM-Omni docs).
async_chunk: false

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      codec_chunk_frames: 25
      codec_left_context_frames: 25

stages:
  - stage_id: 0           # Thinker: text/reasoning + API server.
    max_model_len: 8192
    max_num_batched_tokens: 8192
    max_num_seqs: 8
    # In the v2 smoke log, gpu_memory_utilization=0.82 made vLLM-Omni target a
    # ~65 GiB KV-cache pool after the thinker had already loaded ~59 GiB of
    # weights, so stage 0 OOMed during KV allocation. For this smoke profile,
    # target ~12 GiB of KV cache instead (~0.15 of an 80 GiB card).
    gpu_memory_utilization: 0.15
    trust_remote_code: true
    enable_prefix_caching: false
    devices: "0"
    default_sampling_params:
      temperature: 0.4
      top_p: 0.9
      top_k: 1
      max_tokens: 2048
      seed: 42
      repetition_penalty: 1.05

  - stage_id: 1           # Talker: speech generation.
    max_model_len: 8192
    max_num_batched_tokens: 8192
    max_num_seqs: 8
    gpu_memory_utilization: 0.45
    trust_remote_code: true
    enable_prefix_caching: false
    devices: "1"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      seed: 42
      repetition_penalty: 1.05

  - stage_id: 2           # Code2wav: audio codec / vocoder.
    max_model_len: 8192
    max_num_batched_tokens: 16384
    max_num_seqs: 8
    gpu_memory_utilization: 0.08
    enforce_eager: true   # generation loop is cudagraph-incompatible
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: false
    devices: "1"
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      repetition_penalty: 1.1

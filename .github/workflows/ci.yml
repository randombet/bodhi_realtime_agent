name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck tests
        run: pnpm typecheck:tests

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # Packed-consumer gate (scripts/verify-pack.mjs), the one release.yml runs before
      # publishing: pack, clean --ignore-scripts install, ESM/CJS runtime and declaration
      # resolution (the packed post-session API probe included) and the node_modules-free
      # bundle run. Run here too so a PR that breaks the packed declarations fails before
      # release, not at it. Needs the dist/ that Build produced.
      - name: Verify pack
        run: pnpm verify:pack

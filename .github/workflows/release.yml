name: Release to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      # Packed-consumer gate (scripts/verify-pack.mjs): pack, clean --ignore-scripts install,
      # ESM/CJS/declaration resolution and the node_modules-free bundle run.
      - name: Verify pack
        run: pnpm verify:pack

      # OIDC trusted publishing — no NPM_TOKEN needed.
      # Configure the trust relationship at:
      #   https://www.npmjs.com/package/bodhi-realtime-agent/access
      - name: Publish to npm
        run: npm publish --provenance --access public

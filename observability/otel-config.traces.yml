# OpenTelemetry Collector — OPTIONAL traces pipeline.
#
# Separate from the default metrics-only template (otel-config.yml). Forwards
# OTLP spans from createOtelTracingHooks to a trace backend (Tempo/Jaeger).
# Prometheus stores metrics only, so traces need this dedicated backend.
#
# Validate: `otelcol validate --config observability/otel-config.traces.yml`
# (not run in CI here — requires the collector binary).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # Point at a Tempo (or Jaeger OTLP) instance reachable from the Collector.
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]

# Self-hosted observability stack (Phase 1/3 baseline): Prometheus scrapes the
# app's /metrics endpoint directly; Grafana renders the provisioned dashboard.
#
#   docker compose -f observability/dashboards/docker-compose.yml up
#   Grafana → http://localhost:3000 (anonymous admin)   Prometheus → :9090
#
# The host app must mount createMetricsHandler() at /metrics — set its host:port
# in prometheus.yml (default host.docker.internal:8787).
services:
  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana-oss:latest
    ports: ["3000:3000"]
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

  # Phase 2 (optional OTLP push path): uncomment to run the OTel Collector and
  # add an `otel-collector:8889` scrape job to prometheus.yml. See ../otel-config.yml.
  # otel-collector:
  #   image: otel/opentelemetry-collector-contrib:latest
  #   command: ["--config=/etc/otel-config.yml"]
  #   volumes: ["../otel-config.yml:/etc/otel-config.yml:ro"]
  #   ports: ["4317:4317", "4318:4318", "8889:8889"]
